spring.application.name=SeeFutureds

# ===== Banco H2 em arquivo local =====
spring.datasource.url=jdbc:h2:file:./dados/seefuture_db;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Executa o script schema.sql automaticamente ao iniciar
spring.sql.init.mode=always
